const ENEMY_DEFS = [

const CARD_BY_ID = new Map(CARD_DEFS.map((card) => [card.id, card]));
const RELIC_BY_ID = new Map(RELIC_DEFS.map((relic) => [relic.id, relic]));
const STARTER = ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'flurry', 'venom'];
const REWARD_POOL = CARD_DEFS.filter((card) => card.rarity !== 'starter');
const clone = (value) => JSON.parse(JSON.stringify(value));

function hashSeed(value) {
  const text = String(value);
  let hash = 2166136261;
  for (let i = 0; i < text.length; i += 1) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return hash >>> 0;
}

class Game {
  constructor({ seed = Date.now().toString(36) } = {}) {
    this.seed = String(seed);
    this._rngState = hashSeed(this.seed);
    this._instanceCounter = 0;
    this._logCounter = 0;
    this.state = this._emptyState();
  }

  _emptyState() {
    return {
      phase: 'title', rewardStage: null, seed: this.seed, room: 0, totalRooms: 5, turn: 0,
      player: { hp: 42, maxHp: 42, block: 0, energy: 3, maxEnergy: 3, counter: 0 },
      enemy: null, hand: [], drawPile: [], discardPile: [], exhaustPile: [], deck: [], relics: [],
      cardChoices: [], relicChoices: [], chosenCard: null, chosenRelic: null,
      dependence: 0, unassistedTurns: 0, shadowUsedThisTurn: false, shadowUses: 0,
      stats: { cardsPlayed: 0, damageDealt: 0, shadowUses: 0, battlesWon: 0 },
      log: [], ending: null, recoveryAmount: 6,
    };
  }

  _random() {
    this._rngState = (this._rngState + 0x6D2B79F5) >>> 0;
    let value = this._rngState;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  }

  _shuffle(values) {
    const array = values.slice();
    for (let i = array.length - 1; i > 0; i -= 1) {
      const j = Math.floor(this._random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  _instance(cardId) { return { instanceId: `card-${++this._instanceCounter}`, cardId }; }
  _hasRelic(id) { return this.state.relics.some((relic) => relic.id === id); }
  _log(text, tone = 'normal') {
    this.state.log.push({ id: ++this._logCounter, text, tone });
    this.state.log = this.state.log.slice(-8);
  }
  _fail(message) { return { ok: false, message }; }

  start(seed = this.seed) {
    this.seed = String(seed);
    this._rngState = hashSeed(this.seed);
    this._instanceCounter = 0;
    this._logCounter = 0;
    this.state = this._emptyState();
    this.state.deck = STARTER.map((id) => this._instance(id));
    this.state.room = 1;
    this._log('影子：先看看对方的意图。你可以自己出牌，也可以让我帮忙。', 'shadow');
    this._beginBattle();
    return { ok: true };
  }

  _beginBattle() {
    const s = this.state;
    const kind = s.room === 3 ? 'elite' : s.room === 4 ? 'late' : s.room === 5 ? 'boss' : 'normal';
    const pool = ENEMY_DEFS.filter((enemy) => enemy.kind === kind);
    const def = pool[Math.floor(this._random() * pool.length)];
    const extraHp = s.room === 2 ? 5 : 0;
    s.enemy = { ...clone(def), maxHp: def.hp + extraHp, hp: def.hp + extraHp, block: 0, poison: 0, intentIndex: 0 };
    s.phase = 'combat';
    s.rewardStage = null;
    s.cardChoices = [];
    s.relicChoices = [];
    s.chosenCard = null;
    s.chosenRelic = null;
    s.turn = 0;
    s.hand = [];
    s.drawPile = this._shuffle(s.deck.map((card) => ({ ...card })));
    s.discardPile = [];
    s.exhaustPile = [];
    s.player.block = 0;
    s.player.counter = 0;
    this._startTurn();
    if (this._hasRelic('buckle')) s.player.block += 8;
    this._log(`第 ${s.room} 道门 · ${s.enemy.name}`, 'room');
  }

  _startTurn() {
    const s = this.state;
    s.turn += 1;
    s.player.energy = s.player.maxEnergy;
    s.player.block = 0;
    s.player.counter = 0;
    s.shadowUsedThisTurn = false;
    this._turnHits = 0;
    this._draw(5 + (this._hasRelic('pocket') ? 1 : 0));
    this._updateIntent();
  }

  _updateIntent() {
    const enemy = this.state.enemy;
    const raw = enemy.pattern[enemy.intentIndex % enemy.pattern.length];
    const bonus = this.state.room === 2 && raw.type === 'attack' ? 1 : 0;
    enemy.intent = { ...raw };
    if (raw.type === 'attack') {
      enemy.intent.damage += bonus;
      enemy.intent.label = raw.hits > 1 ? `攻击 ${enemy.intent.damage} × ${raw.hits}` : `攻击 ${enemy.intent.damage}`;
    } else {
      enemy.intent.label = `获得 ${raw.block} 护盾`;
    }
  }

  _draw(count) {
    const s = this.state;
    for (let i = 0; i < count; i += 1) {
      if (!s.drawPile.length && s.discardPile.length) {
        s.drawPile = this._shuffle(s.discardPile);
        s.discardPile = [];
      }
      if (!s.drawPile.length) break;
      s.hand.push(s.drawPile.pop());
    }
  }

  _gainBlock(amount) { this.state.player.block += amount + (this._hasRelic('anchor') ? 2 : 0); }
  _heal(amount) {
    const player = this.state.player;
    const healed = Math.min(amount, player.maxHp - player.hp);
    player.hp += healed;
    return healed;
  }
  _poison(amount) { this.state.enemy.poison += amount + (this._hasRelic('spore') ? 2 : 0); }

  _damageEnemy(amount, { ignoreBlock = false, attack = false } = {}) {
    const s = this.state;
    if (s.enemy.hp <= 0) return;
    const boosted = amount + (attack && this._hasRelic('razor') ? 1 : 0);
    const absorbed = ignoreBlock ? 0 : Math.min(boosted, s.enemy.block);
    s.enemy.block -= absorbed;
    const damage = Math.min(s.enemy.hp, boosted - absorbed);
    s.enemy.hp -= damage;
    s.stats.damageDealt += damage;
    if (attack) {
      this._turnHits += 1;
      if (this._hasRelic('mirror') && this._turnHits % 3 === 0) {
        s.player.energy += 1;
        this._log('裂纹镜：第三次命中，获得 1 点能量。', 'relic');
      }
    }
  }

  playCard(instanceId) {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在不能出牌。');
    const index = s.hand.findIndex((card) => card.instanceId === instanceId);
    if (index < 0) return this._fail('这张牌不在手中。');
    const def = CARD_BY_ID.get(s.hand[index].cardId);
    if (s.player.energy < def.cost) return this._fail('能量不足。');
    this._resolveCard(index, false);
    return { ok: true };
  }

  _resolveCard(index, shadow) {
    const s = this.state;
    const [card] = s.hand.splice(index, 1);
    const def = CARD_BY_ID.get(card.cardId);
    s.player.energy -= def.cost;
    s.stats.cardsPlayed += 1;
    this._log(`${shadow ? '影子抢先打出' : '打出'}「${def.name}」${shadow ? `，消耗 ${def.cost} 点能量。` : '。'}`, shadow ? 'shadow' : 'card');
    switch (card.cardId) {
      case 'strike': this._damageEnemy(6, { attack: true }); break;
      case 'guard': this._gainBlock(6); break;
      case 'flurry': for (let n = 0; n < 3 && s.enemy.hp > 0; n += 1) this._damageEnemy(2, { attack: true }); break;
      case 'venom': this._damageEnemy(2, { attack: true }); this._poison(4); break;
      case 'needle': this._damageEnemy(3, { attack: true }); this._draw(1); break;
      case 'quickstep': this._gainBlock(4); this._draw(1); break;
      case 'echo': this._damageEnemy(4, { attack: true }); this._draw(2); break;
      case 'bloom': this._poison(9); break;
      case 'catalyst': if (s.enemy.poison) s.enemy.poison *= 2; else this._poison(3); break;
      case 'shieldbash': this._gainBlock(3); this._damageEnemy(s.player.block, { attack: true }); break;
      case 'bulwark': this._gainBlock(15); break;
      case 'riposte': this._gainBlock(6); s.player.counter += 3; break;
      case 'shred': for (let n = 0; n < 3 && s.enemy.hp > 0; n += 1) this._damageEnemy(5, { attack: true }); break;
      case 'renew': this._heal(5); break;
      case 'focus': s.player.energy += 1; this._draw(1); break;
      default: throw new Error(`Unknown card: ${card.cardId}`);
    }
    (def.tags.includes('exhaust') ? s.exhaustPile : s.discardPile).push(card);
    if (s.enemy.hp <= 0) this._winBattle();
  }

  useShadow() {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在无法求助。');
    if (s.shadowUsedThisTurn) return this._fail('每回合只能向影子求助一次。');
    s.shadowUsedThisTurn = true;
    s.shadowUses += 1;
    s.stats.shadowUses += 1;
    s.dependence = Math.min(6, s.dependence + 1);
    s.unassistedTurns = 0;
    s.player.energy += 2;
    this._draw(1);
    this._log(s.dependence >= 3 ? '影子：交给我。你只需要继续叫我。［+2 能量，抽 1 张；它可能替你出牌］' : '影子：让我帮你。［+2 能量，抽 1 张；依赖 +1］', 'shadow');
    return { ok: true };
  }

  _eligibleCards() {
    return this.state.hand.map((card, index) => ({ card, index })).filter(({ card }) => CARD_BY_ID.get(card.cardId).cost <= this.state.player.energy);
  }

  endTurn() {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在不能结束回合。');
    // Capture takeover eligibility before recovery lowers dependence. Settle
    // completed-turn benefits before an automatic lethal card can end combat.
    const eligible = s.dependence >= 3 ? this._eligibleCards() : [];
    if (!s.shadowUsedThisTurn) {
      s.unassistedTurns += 1;
      if (s.dependence > 0 && s.unassistedTurns % 2 === 0) {
        s.dependence -= 1;
        this._log('你连续两个回合自己行动。依赖 −1。', 'recovery');
      }
      if (this._hasRelic('lantern')) this._heal(2);
    }

    // At high dependence the companion acts before the player's chosen end.
    if (eligible.length) {
      const picked = eligible[Math.floor(this._random() * eligible.length)];
      this._resolveCard(picked.index, true);
      if (s.phase !== 'combat') return { ok: true };
    }

    s.discardPile.push(...s.hand);
    s.hand = [];

    if (s.enemy.poison > 0) {
      const amount = s.enemy.poison;
      this._damageEnemy(amount, { ignoreBlock: true });
      s.enemy.poison -= 1;
      this._log(`余毒造成 ${amount} 点伤害。`, 'poison');
      if (s.enemy.hp <= 0) { this._winBattle(); return { ok: true }; }
    }

    s.enemy.block = 0;
    const intent = s.enemy.intent;
    if (intent.type === 'guard') {
      s.enemy.block = intent.block;
      this._log(`${s.enemy.name}获得 ${intent.block} 点护盾。`, 'enemy');
    } else {
      let totalDamage = 0;
      let blocked = 0;
      for (let hit = 0; hit < intent.hits; hit += 1) {
        const absorbed = Math.min(s.player.block, intent.damage);
        s.player.block -= absorbed;
        blocked += absorbed;
        const damage = Math.min(s.player.hp, intent.damage - absorbed);
        s.player.hp -= damage;
        totalDamage += damage;
        if (absorbed > 0) {
          const counter = s.player.counter + (this._hasRelic('thorns') ? 3 : 0);
          if (counter) this._damageEnemy(counter);
        }
        if (s.player.hp <= 0 || s.enemy.hp <= 0) break;
      }
      this._log(`${s.enemy.name}攻击：受到 ${totalDamage} 点伤害${blocked ? `，挡住 ${blocked} 点` : ''}。`, 'enemy');
      if (s.player.hp <= 0) {
        s.phase = 'defeat';
        s.ending = 'try-again';
        this._log('这次停在了这里。带着发现，重新开始。', 'ending');
        return { ok: true };
      }
      if (s.enemy.hp <= 0) { this._winBattle(); return { ok: true }; }
    }
    s.enemy.intentIndex += 1;
    this._startTurn();
    return { ok: true };
  }

  _winBattle() {
    const s = this.state;
    if (s.phase !== 'combat') return;
    s.stats.battlesWon += 1;
    this._log(`${s.enemy.name}退去了。`, 'win');
    if (s.room === s.totalRooms) {
      s.phase = 'victory';
      s.ending = s.dependence === 0 ? 'independent' : 'with-shadow';
      this._log(s.dependence === 0 ? '这次，你先迈出了脚步。影子回到了你的脚下。' : '你走到了门外。影子仍然在，但接下来仍由你选择。', 'ending');
      return;
    }
    s.phase = 'reward';
    s.rewardStage = 'card';
    s.cardChoices = this._shuffle(REWARD_POOL).slice(0, 3).map((card) => ({ ...card }));
    s.relicChoices = this._shuffle(RELIC_DEFS.filter((relic) => !this._hasRelic(relic.id))).slice(0, 3).map((relic) => ({ ...relic }));
  }

  chooseCard(cardId) {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'card') return this._fail('现在不能选择卡牌。');
    if (!s.cardChoices.some((card) => card.id === cardId)) return this._fail('这张牌不在奖励中。');
    s.deck.push(this._instance(cardId));
    s.chosenCard = cardId;
    s.rewardStage = 'relic';
    this._log(`将「${CARD_BY_ID.get(cardId).name}」加入牌组。`, 'reward');
    return { ok: true };
  }

  chooseRelic(relicId) {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'relic') return this._fail('先选择一张卡牌。');
    if (!s.relicChoices.some((relic) => relic.id === relicId) || this._hasRelic(relicId)) return this._fail('这件遗物不在奖励中。');
    const relic = { ...RELIC_BY_ID.get(relicId) };
    s.relics.push(relic);
    s.chosenRelic = relicId;
    s.rewardStage = 'ready';
    this._log(`获得遗物「${relic.name}」。`, 'reward');
    return { ok: true };
  }

  continueRun() {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'ready') return this._fail('先选择卡牌与遗物。');
    const healed = this._heal(s.recoveryAmount);
    if (healed) this._log(`门后的短暂休息，恢复 ${healed} 点生命。`, 'recovery');
    s.room += 1;
    this._beginBattle();
    return { ok: true };
  }

  getState() {
    const snapshot = clone(this.state);
    const enrich = (cards) => cards.map((card) => ({ ...CARD_BY_ID.get(card.cardId), ...card }));
    for (const pile of ['hand', 'drawPile', 'discardPile', 'exhaustPile', 'deck']) snapshot[pile] = enrich(snapshot[pile]);
    snapshot.drawCount = snapshot.drawPile.length;
    snapshot.discardCount = snapshot.discardPile.length;
    snapshot.exhaustCount = snapshot.exhaustPile.length;
    snapshot.shadowWillIntervene = snapshot.phase === 'combat' && snapshot.dependence >= 3 && this._eligibleCards().length > 0;
    snapshot.shadowRecoveryIn = snapshot.dependence > 0 ? 2 - snapshot.unassistedTurns % 2 : 0;
    return snapshot;
  }
}

function suit(card) {
  if (card.tags?.includes('poison')) return 'poison';
  if (card.tags?.includes('block')) return 'guard';
  return card.type === 'attack' ? 'attack' : 'skill';
}
function cardArt(card) {
  const kind = card.tags?.includes('heal') ? 'heal' : suit(card);
  return `<svg viewBox="0 0 80 80" aria-hidden="true">${artPaths[kind]}</svg>`;
}
function relicArt(id) {
  return `<svg viewBox="0 0 80 80" aria-hidden="true">${artPaths[id] || artPaths.mirror}</svg>`;
}
function cardMarkup(card, index = 0, reward = false, preview = false) {
  const type = card.type === 'attack' ? '攻击' : '技巧';
  const tag = card.tags?.includes('poison') ? '中毒' : card.tags?.includes('combo') ? '连击' : card.tags?.includes('counter') ? '反击' : card.tags?.includes('block') ? '守势' : card.tags?.includes('draw') ? '过牌' : '基础';
  const action = reward ? 'choose-card' : 'play';
  const disabled = preview || (!reward && (state.phase !== 'combat' || card.cost > state.player.energy));
  return `<button class="playing-card" data-action="${action}" data-id="${escapeHTML(reward ? card.id : card.instanceId)}" data-suit="${suit(card)}" ${disabled ? 'disabled' : ''} aria-label="${escapeHTML(`${card.name}，消耗 ${card.cost} 能量。${card.description}`)}"><span class="card-top"><span class="card-cost">${card.cost}</span><span class="card-type">${type}</span></span><span class="card-art">${cardArt(card)}</span><strong class="card-name">${escapeHTML(card.name)}</strong><span class="card-description">${escapeHTML(card.description)}</span><span class="card-bottom"><span>${tag}</span>${!reward && !preview ? `<kbd>${index + 1}</kbd>` : '<span>选择</span>'}</span></button>`;
}

function battleMarkup() {
  const e = state.enemy;
  const intent = e.intent;
  const damage = intent.damage || 0;
  const intentText = intent.type === 'guard' ? `获得 ${intent.block} 护盾` : `${damage} 伤害${intent.hits > 1 ? ` × ${intent.hits}` : ''}`;
  return `<div class="enemy-scene"><div class="enemy-info"><h2 class="enemy-name">${escapeHTML(e.name)}</h2><p class="enemy-subtitle">${escapeHTML(e.subtitle)}</p><div class="enemy-health"><strong>${e.hp}</strong><span>/ ${e.maxHp} 生命</span></div><div class="enemy-health-track" role="progressbar" aria-label="对手生命" aria-valuemin="0" aria-valuemax="${e.maxHp}" aria-valuenow="${e.hp}"><span style="transform:scaleX(${e.hp / e.maxHp})"></span></div><div class="status-tags">${e.block ? `<span>护盾 ${e.block}</span>` : ''}${e.poison ? `<span>毒 ${e.poison}</span>` : ''}</div></div><div class="enemy-portrait">${enemyArt(e.id)}</div><div class="intent"><p>对手下一步</p><strong>${intentText}</strong><small>${intent.type === 'guard' ? '这一回合可以准备组合。' : '护盾可以抵挡伤害。'}</small></div></div>`;
}

function rewardMarkup() {
  if (state.rewardStage === 'card') return `<div class="reward-screen"><h2>带走一种新的可能。</h2><p>选择一张牌加入牌组，然后挑选遗物。</p><div class="reward-options">${state.cardChoices.map((c, i) => cardMarkup(c, i, true)).join('')}</div></div>`;
  if (state.rewardStage === 'relic') return `<div class="reward-screen"><h2>让组合开始生长。</h2><p>选择一件遗物。被动效果会持续整局。</p><div class="reward-options">${state.relicChoices.map((r) => `<button class="relic-option" data-action="choose-relic" data-id="${r.id}"><div class="relic-art">${relicArt(r.id)}</div><strong>${escapeHTML(r.name)}</strong><p>${escapeHTML(r.description)}</p></button>`).join('')}</div></div>`;
  const card = CARD_DEFS.find((c) => c.id === state.chosenCard);
  const relic = RELIC_DEFS.find((r) => r.id === state.chosenRelic);
  return `<div class="ready-screen"><h2>下一扇门，带着新的组合。</h2><p>获得「${escapeHTML(card?.name)}」与「${escapeHTML(relic?.name)}」。</p><p>继续前恢复最多 ${state.recoveryAmount} 点生命。</p><button class="primary-button" data-action="continue">进入第 ${state.room + 1} 道门</button></div>`;
}

function endingMarkup() {
  const won = state.phase === 'victory';
  const independent = state.dependence === 0;
  const title = !won ? '牌局停在这里。' : independent ? '这一次，你先行动。' : '你和影子，走到了出口。';
  const text = !won ? '这些牌还没找到彼此的位置。保留对这套组合的认识，下一局再试一次。' : independent ? '影子没有消失。它退回你的脚下，重新跟随你的脚步。' : '借来的力量帮你走到了这里。下一局，可以试试让自己的组合接过它的位置。';
  return `<div class="ending-screen"><h2>${title}</h2><p>${text}</p><div class="ending-stats"><span><strong>${state.stats.battlesWon} / ${state.totalRooms}</strong>通过挑战</span><span><strong>${state.stats.cardsPlayed}</strong>打出卡牌</span><span><strong>${state.shadowUses}</strong>向影子求助</span><span><strong>${state.relics.length}</strong>获得遗物</span></div>${won ? '<blockquote>Dream without action<br>is hallucination.</blockquote>' : ''}<div class="ending-actions"><button class="primary-button" data-action="restart">新的牌局</button><button class="text-button" data-action="retry">再试同一局</button></div></div>`;
}

function render() {
  state = game.getState();
  const combat = state.phase === 'combat';
  const title = state.phase === 'title';
  $('journey').innerHTML = Array.from({ length: 5 }, (_, i) => `${i ? '<span class="journey-line" aria-hidden="true"></span>' : ''}<div class="journey-step ${state.room === i + 1 ? 'is-current' : state.room > i + 1 || state.phase === 'victory' ? 'is-done' : ''}" ${state.room === i + 1 ? 'aria-current="step"' : ''}><span>${state.room > i + 1 || state.phase === 'victory' ? '✓' : i + 1}</span><span>${['初见', '回响', '第二天', '回流', '另一个我'][i]}</span></div>`).join('');
  $('room-label').textContent = title ? '新的牌局' : state.phase === 'reward' ? `第 ${state.room} 道门已通过` : `第 ${state.room} 道门 / 共 ${state.totalRooms} 道`;
  $('turn-label').textContent = combat ? `你的回合 ${state.turn}` : title ? '准备入座' : state.phase === 'reward' ? '选择奖励' : '本局结束';

  $('hand-region').hidden = !(combat || title);

  const oldScroll = $('hand').scrollLeft;
  const preview = ['strike', 'guard', 'flurry', 'venom', 'focus'].map((id) => CARD_DEFS.find((c) => c.id === id));
  $('hand').innerHTML = title ? preview.map((c, i) => cardMarkup(c, i, false, true)).join('') : state.hand.length ? state.hand.map((c, i) => cardMarkup(c, i)).join('') : '<p class="empty-hand">手牌已打完。结束回合，抽取新的手牌。</p>';
  $('hand').scrollLeft = oldScroll;
  $('energy-value').textContent = state.player.energy;

  $('end-turn').disabled = !combat;
  $('hp-value').textContent = state.player.hp;
  $('max-hp').textContent = `/ ${state.player.maxHp} 生命`;
  $('block-value').textContent = `护盾 ${state.player.block}`;
  $('health-fill').style.transform = `scaleX(${state.player.hp / state.player.maxHp})`;
  $('health-meter').setAttribute('aria-valuenow', state.player.hp);

  $('deck-count').textContent = state.deck.length;
  $('shadow-art').innerHTML = shadowArt(state.dependence);

  $('shadow-dialogue').textContent = state.phase === 'victory' ? independentDialogue() : state.shadowUsedThisTurn ? '“看，多简单。你可以再相信我一点。”' : state.dependence >= 3 ? '“剩下的交给我。你不必每次都自己决定。”' : state.dependence ? '“需要的时候，叫我就好。”' : '“先看看对方的意图。需要的时候，我会在。”';
  $('shadow-help').disabled = !combat || state.shadowUsedThisTurn;

  $('shadow-rule').textContent = state.dependence ? `再独立完成 ${state.shadowRecoveryIn} 个回合，依赖降低 1。` : '每连续 2 个回合不求助，依赖降低 1。';

}

function independentDialogue() { return state.dependence === 0 ? '“这一次，你不用等我。”' : '“下一次，你还会叫我吗？”'; }

function updateSettings() {
  $('sound-icon').innerHTML = icon(soundOn ? 'sound' : 'muted');
  const soundButton = document.querySelector('[data-action="sound"]');
  soundButton.setAttribute('aria-label', soundOn ? '关闭音效' : '打开音效');
  soundButton.setAttribute('aria-pressed', String(soundOn));
  $('motion-icon').innerHTML = icon(motionOff ? 'still' : 'motion');
  const motionButton = document.querySelector('[data-action="motion"]');
  motionButton.setAttribute('aria-label', motionOff ? '打开画面动态' : '关闭画面动态');
  motionButton.setAttribute('aria-pressed', String(motionOff));
}

function sound(kind) {
  if (!soundOn) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    const now = audio.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(kind === 'shadow' ? 196 : kind === 'hurt' ? 120 : kind === 'reward' ? 523.25 : 330, now);
    osc.frequency.exponentialRampToValueAtTime(kind === 'hurt' ? 70 : kind === 'shadow' ? 392 : 440, now + .16);
    gain.gain.setValueAtTime(.045, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .3);
    osc.connect(gain).connect(audio.destination);
    osc.start(now); osc.stop(now + .3);
  } catch { soundOn = false; updateSettings(); }
}

function notice(text) {
  clearTimeout(messageTimer);
  $('message').textContent = text;
  $('message').hidden = false;
  messageTimer = setTimeout(() => { $('message').hidden = true; }, 2800);
}

function illuminate() {
  clearTimeout(lightTimer);
  document.body.classList.remove('withdrawal');
  document.body.classList.add('assisted');
  lightTimer = setTimeout(() => {
    document.body.classList.remove('assisted');
    if (state.phase === 'combat' && state.dependence > 0 && !motionOff) {
      document.body.classList.add('withdrawal');
      setTimeout(() => document.body.classList.remove('withdrawal'), 1100);
    }
  }, 7500);
}

function perform(method, value) {
  const previous = game.getState();
  const focused = document.activeElement;
  const handIndex = focused?.matches('.playing-card') ? previous.hand.findIndex((c) => c.instanceId === focused.dataset.id) : -1;
  const result = game[method](value);
  if (!result.ok) return notice(result.message);
  if (method === 'useShadow') { illuminate(); sound('shadow'); }
  else sound(method.startsWith('choose') ? 'reward' : 'card');
  render();
  if (state.dependence === 0 && previous.dependence > 0) { clearTimeout(lightTimer); document.body.classList.remove('assisted', 'withdrawal'); }
  if (state.player.hp < previous.player.hp) { sound('hurt'); animate($('health-meter'), 'hit-reaction'); }
  else if (state.enemy?.hp < previous.enemy?.hp) animate(document.querySelector('.enemy-portrait'), 'hit-reaction');
  const changedPhase = state.phase !== previous.phase || state.rewardStage !== previous.rewardStage;
  if (state.phase === 'combat' && (changedPhase || handIndex >= 0 || method === 'useShadow' || (method === 'endTurn' && !document.body.contains(focused)))) {
    const allCards = [...$('hand').querySelectorAll('.playing-card')];
    const preferred = allCards.slice(Math.max(0, handIndex)).find((c) => !c.disabled);
    const focusTarget = preferred || allCards.find((c) => !c.disabled) || $('end-turn');
    focusTarget.focus({ preventScroll: true });
  } else if (changedPhase) {
    $('arena').querySelector('button:not(:disabled)')?.focus({ preventScroll: true });
  }
  const latest = state.log.at(-1);
  if (latest) $('announcement').textContent = latest.text;
}

function animate(element, className) {
  if (!element || motionOff) return;
  element.classList.remove(className);
  requestAnimationFrame(() => { element.classList.add(className); setTimeout(() => element.classList.remove(className), 350); });
}

function restart(same = false) {
  const seed = same ? state.seed : freshSeed();
  clearTimeout(lightTimer);
  document.body.classList.remove('assisted', 'withdrawal');
  game = new Game({ seed });
  perform('start');
}

function sheet(title, html) {
  $('sheet-title').textContent = title;
  $('sheet-content').innerHTML = html;
  if (!$('sheet').open) $('sheet').showModal();
}

function showRules() {
  sheet('在牌桌上，先试着自己决定。', '<ol class="rules-list"><li><strong>看意图，再出牌。</strong>对手的下一步会提前显示。攻击削减生命，护盾抵挡伤害；护盾在你的下一回合开始时清空。</li><li><strong>每回合 3 能量，抽 5 张牌。</strong>点击卡牌出牌。结束回合后，剩余手牌进入弃牌堆；抽牌堆用尽时会重新洗牌。</li><li><strong>让卡牌与遗物配合。</strong>锯齿适合多段攻击，黑色孢子加强中毒，沉锚与荆棘环适合防守反击。每次胜利都能选择新的奖励。</li><li><strong>影子可以借你力量。</strong>每回合可求助一次，立刻获得 2 能量并抽 1 张牌，同时增加 1 依赖。依赖达到 3 时，它会在你结束回合时尝试替你出一张剩余的牌，并消耗能量。</li><li><strong>也可以慢慢不用它。</strong>每连续两个不求助的回合，依赖降低 1。你始终可以靠自己的牌组通关。</li></ol><p class="sheet-note">数字键 1–9 出牌，E 结束回合，S 求助影子。右上角可以打开音效或关闭画面动态。共五场战斗，战斗之间恢复最多 6 点生命。</p>');
}

function showDeck() {
  const cards = state.phase === 'title' ? ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'flurry', 'venom'].map((id) => CARD_DEFS.find((c) => c.id === id)) : state.deck;
  const grouped = new Map();
  for (const card of cards) {
    const id = card.cardId || card.id;
    const group = grouped.get(id) || { ...card, count: 0 };
    group.count += 1; grouped.set(id, group);
  }
  sheet(`你的牌组，${cards.length} 张`, `<ul class="deck-list">${[...grouped.values()].map((c) => `<li><span class="deck-cost">${c.cost}</span><div><strong>${escapeHTML(c.name)}</strong><small>${escapeHTML(c.description)}</small></div><span>×${c.count}</span></li>`).join('')}</ul>`);
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const action = target.dataset.action;
  if (action === 'start') perform('start');
  else if (action === 'play') perform('playCard', target.dataset.id);
  else if (action === 'end-turn') perform('endTurn');
  else if (action === 'shadow') perform('useShadow');
  else if (action === 'choose-card') perform('chooseCard', target.dataset.id);
  else if (action === 'choose-relic') perform('chooseRelic', target.dataset.id);
  else if (action === 'continue') perform('continueRun');
  else if (action === 'restart') {
    if (state.phase === 'combat' || state.phase === 'reward') sheet('重新开始这一局？', '<p class="sheet-note">当前牌局的进度将结束。新的牌局会重新生成敌人和奖励。</p><div class="ending-actions"><button class="primary-button" data-action="confirm-restart">开始新一局</button><button class="text-button" data-action="close-sheet">继续当前牌局</button></div>');
    else restart();
  }
  else if (action === 'confirm-restart') { $('sheet').close(); restart(); }
  else if (action === 'retry') restart(true);
  else if (action === 'rules') showRules();
  else if (action === 'deck') showDeck();
  else if (action === 'close-sheet') $('sheet').close();
  else if (action === 'relic-info') { const relic = state.relics.find((r) => r.id === target.dataset.id); if (relic) sheet(relic.name, `<p class="sheet-note">${escapeHTML(relic.description)}</p>`); }
  else if (action === 'sound') { soundOn = !soundOn; updateSettings(); if (soundOn) sound('card'); }
  else if (action === 'motion') { motionOff = !motionOff; document.body.classList.toggle('still', motionOff); document.body.classList.remove('withdrawal'); updateSettings(); }
});

document.addEventListener('keydown', (event) => {
  if ($('sheet').open || event.ctrlKey || event.metaKey || event.altKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
  if (state.phase !== 'combat' || event.repeat) return;
  const key = event.key.toLowerCase();
  if (key === 'e') { event.preventDefault(); perform('endTurn'); }
  else if (key === 's') { event.preventDefault(); perform('useShadow'); }
  else if (/^[1-9]$/.test(key)) { event.preventDefault(); const card = state.hand[Number(key) - 1]; if (card) perform('playCard', card.instanceId); }
});

render();

</script>
</body>
</html>
