];


const ENGLISH_CARDS = {"strike": ["Strike", "Deal 6 damage.", "6"], "guard": ["Guard", "Gain 6 guard. Guard resets next turn.", "6"], "flurry": ["Flurry", "Hit 3 times for 2 damage each.", "2 \u00d7 3"], "venom": ["Venom", "Deal 2 damage. Add 4 poison. Poison bypasses guard at turn end.", "2 + 4"], "needle": ["Needle", "Deal 3 damage. Draw 1. Removed for this fight.", "3 + 1"], "quickstep": ["Step", "Gain 4 guard. Draw 1. Removed for this fight.", "4 + 1"], "echo": ["Echo", "Deal 4 damage. Draw 2.", "4 + 2"], "bloom": ["Bloom", "Add 9 poison. Poison ticks at turn end, then loses 1.", "9"], "catalyst": ["Spread", "Double poison. If none, add 3.", "\u00d7 2"], "shieldbash": ["Bash", "Gain 3 guard, then deal damage equal to your guard.", "3 + \u25c7"], "bulwark": ["Shelter", "Gain 15 guard.", "15"], "riposte": ["Return", "Gain 6 guard. Each blocked hit returns 3 damage this turn.", "6 \u21a9 3"], "shred": ["Shatter", "Hit 3 times for 5 damage each.", "5 \u00d7 3"], "renew": ["Breathe", "Restore 5 health. Removed for this fight.", "+5"], "focus": ["Focus", "Gain 1 energy. Draw 1. Removed for this fight.", "+1 +1"]};
const ENGLISH_RELICS = {"razor": ["Serrated Edge", "Every attack hit deals +1 damage."], "spore": ["Night Seed", "Each poison application adds +2 poison."], "buckle": ["Old Clasp", "Start each fight with 8 guard."], "mirror": ["Split Mirror", "Every third attack hit in a turn gives +1 energy."], "anchor": ["Anchor", "Each card that grants guard gives +2 guard."], "thorns": ["Thorn Ring", "Each blocked hit returns 3 damage."], "pocket": ["Deep Pocket", "Draw one extra card each turn."], "lantern": ["Still Flame", "Restore 2 health after a turn without borrowing."]};

const STARTER = ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'flurry', 'venom'];

const clone = (value) => JSON.parse(JSON.stringify(value));

function hashSeed(value) {
  const text = String(value);
  let hash = 2166136261;
  for (let i = 0; i < text.length; i += 1) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return hash >>> 0;
}

class Game {
  constructor({ seed = Date.now().toString(36) } = {}) {
    this.seed = String(seed);
    this._rngState = hashSeed(this.seed);
    this._instanceCounter = 0;
    this._logCounter = 0;
    this.state = this._emptyState();
  }

  _emptyState() {
    return {
      phase: 'title', rewardStage: null, seed: this.seed, room: 0, totalRooms: 5, turn: 0,
      player: { hp: 42, maxHp: 42, block: 0, energy: 3, maxEnergy: 3, counter: 0 },
      enemy: null, hand: [], drawPile: [], discardPile: [], exhaustPile: [], deck: [], relics: [],
      cardChoices: [], relicChoices: [], chosenCard: null, chosenRelic: null,
      dependence: 0, unassistedTurns: 0, shadowUsedThisTurn: false, shadowUses: 0,
      stats: { cardsPlayed: 0, damageDealt: 0, shadowUses: 0, battlesWon: 0 },
      log: [], ending: null, recoveryAmount: 6,
    };
  }

  _random() {
    this._rngState = (this._rngState + 0x6D2B79F5) >>> 0;
    let value = this._rngState;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  }

  _shuffle(values) {
    const array = values.slice();
    for (let i = array.length - 1; i > 0; i -= 1) {
      const j = Math.floor(this._random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  _instance(cardId) { return { instanceId: `card-${++this._instanceCounter}`, cardId }; }
  _hasRelic(id) { return this.state.relics.some((relic) => relic.id === id); }
  _log(text, tone = 'normal') {
    this.state.log.push({ id: ++this._logCounter, text, tone });
    this.state.log = this.state.log.slice(-8);
  }
  _fail(message) { return { ok: false, message }; }

  start(seed = this.seed) {
    this.seed = String(seed);
    this._rngState = hashSeed(this.seed);
    this._instanceCounter = 0;
    this._logCounter = 0;
    this.state = this._emptyState();
    this.state.deck = STARTER.map((id) => this._instance(id));
    this.state.room = 1;
    this._log('影子：先看看对方的意图。你可以自己出牌，也可以让我帮忙。', 'shadow');
    this._beginBattle();
    return { ok: true };
  }

  _beginBattle() {
    const s = this.state;
    const kind = s.room === 3 ? 'elite' : s.room === 4 ? 'late' : s.room === 5 ? 'boss' : 'normal';
    const pool = ENEMY_DEFS.filter((enemy) => enemy.kind === kind);
    const def = pool[Math.floor(this._random() * pool.length)];
    const extraHp = s.room === 2 ? 5 : 0;
    s.enemy = { ...clone(def), maxHp: def.hp + extraHp, hp: def.hp + extraHp, block: 0, poison: 0, intentIndex: 0 };
    s.phase = 'combat';
    s.rewardStage = null;
    s.cardChoices = [];
    s.relicChoices = [];
    s.chosenCard = null;
    s.chosenRelic = null;
    s.turn = 0;
    s.hand = [];
    s.drawPile = this._shuffle(s.deck.map((card) => ({ ...card })));
    s.discardPile = [];
    s.exhaustPile = [];
    s.player.block = 0;
    s.player.counter = 0;
    this._startTurn();
    if (this._hasRelic('buckle')) s.player.block += 8;
    this._log(`第 ${s.room} 道门 · ${s.enemy.name}`, 'room');
  }

  _startTurn() {
    const s = this.state;
    s.turn += 1;
    s.player.energy = s.player.maxEnergy;
    s.player.block = 0;
    s.player.counter = 0;
    s.shadowUsedThisTurn = false;
    this._turnHits = 0;
    this._draw(5 + (this._hasRelic('pocket') ? 1 : 0));
    this._updateIntent();
  }

  _updateIntent() {
    const enemy = this.state.enemy;
    const raw = enemy.pattern[enemy.intentIndex % enemy.pattern.length];
    const bonus = this.state.room === 2 && raw.type === 'attack' ? 1 : 0;
    enemy.intent = { ...raw };
    if (raw.type === 'attack') {
      enemy.intent.damage += bonus;
      enemy.intent.label = raw.hits > 1 ? `攻击 ${enemy.intent.damage} × ${raw.hits}` : `攻击 ${enemy.intent.damage}`;
    } else {
      enemy.intent.label = `获得 ${raw.block} 护盾`;
    }
  }

  _draw(count) {
    const s = this.state;
    for (let i = 0; i < count; i += 1) {
      if (!s.drawPile.length && s.discardPile.length) {
        s.drawPile = this._shuffle(s.discardPile);
        s.discardPile = [];
      }
      if (!s.drawPile.length) break;
      s.hand.push(s.drawPile.pop());
    }
  }

  _gainBlock(amount) { this.state.player.block += amount + (this._hasRelic('anchor') ? 2 : 0); }
  _heal(amount) {
    const player = this.state.player;
    const healed = Math.min(amount, player.maxHp - player.hp);
    player.hp += healed;
    return healed;
  }
  _poison(amount) { this.state.enemy.poison += amount + (this._hasRelic('spore') ? 2 : 0); }

  _damageEnemy(amount, { ignoreBlock = false, attack = false } = {}) {
    const s = this.state;
    if (s.enemy.hp <= 0) return;
    const boosted = amount + (attack && this._hasRelic('razor') ? 1 : 0);
    const absorbed = ignoreBlock ? 0 : Math.min(boosted, s.enemy.block);
    s.enemy.block -= absorbed;
    const damage = Math.min(s.enemy.hp, boosted - absorbed);
    s.enemy.hp -= damage;
    s.stats.damageDealt += damage;
    if (attack) {
      this._turnHits += 1;
      if (this._hasRelic('mirror') && this._turnHits % 3 === 0) {
        s.player.energy += 1;
        this._log('裂纹镜：第三次命中，获得 1 点能量。', 'relic');
      }
    }
  }

  playCard(instanceId) {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在不能出牌。');
    const index = s.hand.findIndex((card) => card.instanceId === instanceId);
    if (index < 0) return this._fail('这张牌不在手中。');
    const def = CARD_BY_ID.get(s.hand[index].cardId);
    if (s.player.energy < def.cost) return this._fail('能量不足。');
    this._resolveCard(index, false);
    return { ok: true };
  }

  _resolveCard(index, shadow) {
    const s = this.state;
    const [card] = s.hand.splice(index, 1);
    const def = CARD_BY_ID.get(card.cardId);
    s.player.energy -= def.cost;
    s.stats.cardsPlayed += 1;
    this._log(`${shadow ? '影子抢先打出' : '打出'}「${def.name}」${shadow ? `，消耗 ${def.cost} 点能量。` : '。'}`, shadow ? 'shadow' : 'card');
    switch (card.cardId) {
      case 'strike': this._damageEnemy(6, { attack: true }); break;
      case 'guard': this._gainBlock(6); break;
      case 'flurry': for (let n = 0; n < 3 && s.enemy.hp > 0; n += 1) this._damageEnemy(2, { attack: true }); break;
      case 'venom': this._damageEnemy(2, { attack: true }); this._poison(4); break;
      case 'needle': this._damageEnemy(3, { attack: true }); this._draw(1); break;
      case 'quickstep': this._gainBlock(4); this._draw(1); break;
      case 'echo': this._damageEnemy(4, { attack: true }); this._draw(2); break;
      case 'bloom': this._poison(9); break;
      case 'catalyst': if (s.enemy.poison) s.enemy.poison *= 2; else this._poison(3); break;
      case 'shieldbash': this._gainBlock(3); this._damageEnemy(s.player.block, { attack: true }); break;
      case 'bulwark': this._gainBlock(15); break;
      case 'riposte': this._gainBlock(6); s.player.counter += 3; break;
      case 'shred': for (let n = 0; n < 3 && s.enemy.hp > 0; n += 1) this._damageEnemy(5, { attack: true }); break;
      case 'renew': this._heal(5); break;
      case 'focus': s.player.energy += 1; this._draw(1); break;
      default: throw new Error(`Unknown card: ${card.cardId}`);
    }
    (def.tags.includes('exhaust') ? s.exhaustPile : s.discardPile).push(card);
    if (s.enemy.hp <= 0) this._winBattle();
  }

  useShadow() {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在无法求助。');
    if (s.shadowUsedThisTurn) return this._fail('每回合只能向影子求助一次。');
    s.shadowUsedThisTurn = true;
    s.shadowUses += 1;
    s.stats.shadowUses += 1;
    s.dependence = Math.min(6, s.dependence + 1);
    s.unassistedTurns = 0;
    s.player.energy += 2;
    this._draw(1);
    this._log(s.dependence >= 3 ? '影子：交给我。你只需要继续叫我。［+2 能量，抽 1 张；它可能替你出牌］' : '影子：让我帮你。［+2 能量，抽 1 张；依赖 +1］', 'shadow');
    return { ok: true };
  }

  _eligibleCards() {
    return this.state.hand.map((card, index) => ({ card, index })).filter(({ card }) => CARD_BY_ID.get(card.cardId).cost <= this.state.player.energy);
  }

  endTurn() {
    const s = this.state;
    if (s.phase !== 'combat') return this._fail('现在不能结束回合。');
    // Capture takeover eligibility before recovery lowers dependence. Settle
    // completed-turn benefits before an automatic lethal card can end combat.
    const eligible = s.dependence >= 3 ? this._eligibleCards() : [];
    if (!s.shadowUsedThisTurn) {
      s.unassistedTurns += 1;
      if (s.dependence > 0 && s.unassistedTurns % 2 === 0) {
        s.dependence -= 1;
        this._log('你连续两个回合自己行动。依赖 −1。', 'recovery');
      }
      if (this._hasRelic('lantern')) this._heal(2);
    }

    // At high dependence the companion acts before the player's chosen end.
    if (eligible.length) {
      const picked = eligible[Math.floor(this._random() * eligible.length)];
      this._resolveCard(picked.index, true);
      if (s.phase !== 'combat') return { ok: true };
    }

    s.discardPile.push(...s.hand);
    s.hand = [];

    if (s.enemy.poison > 0) {
      const amount = s.enemy.poison;
      this._damageEnemy(amount, { ignoreBlock: true });
      s.enemy.poison -= 1;
      this._log(`余毒造成 ${amount} 点伤害。`, 'poison');
      if (s.enemy.hp <= 0) { this._winBattle(); return { ok: true }; }
    }

    s.enemy.block = 0;
    const intent = s.enemy.intent;
    if (intent.type === 'guard') {
      s.enemy.block = intent.block;
      this._log(`${s.enemy.name}获得 ${intent.block} 点护盾。`, 'enemy');
    } else {
      let totalDamage = 0;
      let blocked = 0;
      for (let hit = 0; hit < intent.hits; hit += 1) {
        const absorbed = Math.min(s.player.block, intent.damage);
        s.player.block -= absorbed;
        blocked += absorbed;
        const damage = Math.min(s.player.hp, intent.damage - absorbed);
        s.player.hp -= damage;
        totalDamage += damage;
        if (absorbed > 0) {
          const counter = s.player.counter + (this._hasRelic('thorns') ? 3 : 0);
          if (counter) this._damageEnemy(counter);
        }
        if (s.player.hp <= 0 || s.enemy.hp <= 0) break;
      }
      this._log(`${s.enemy.name}攻击：受到 ${totalDamage} 点伤害${blocked ? `，挡住 ${blocked} 点` : ''}。`, 'enemy');
      if (s.player.hp <= 0) {
        s.phase = 'defeat';
        s.ending = 'try-again';
        this._log('这次停在了这里。带着发现，重新开始。', 'ending');
        return { ok: true };
      }
      if (s.enemy.hp <= 0) { this._winBattle(); return { ok: true }; }
    }
    s.enemy.intentIndex += 1;
    this._startTurn();
    return { ok: true };
  }

  _winBattle() {
    const s = this.state;
    if (s.phase !== 'combat') return;
    s.stats.battlesWon += 1;
    this._log(`${s.enemy.name}退去了。`, 'win');
    if (s.room === s.totalRooms) {
      s.phase = 'victory';
      s.ending = s.dependence === 0 ? 'independent' : 'with-shadow';
      this._log(s.dependence === 0 ? '这次，你先迈出了脚步。影子回到了你的脚下。' : '你走到了门外。影子仍然在，但接下来仍由你选择。', 'ending');
      return;
    }
    s.phase = 'reward';
    s.rewardStage = 'card';
    s.cardChoices = this._shuffle(REWARD_POOL).slice(0, 3).map((card) => ({ ...card }));
    s.relicChoices = this._shuffle(RELIC_DEFS.filter((relic) => !this._hasRelic(relic.id))).slice(0, 3).map((relic) => ({ ...relic }));
  }

  chooseCard(cardId) {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'card') return this._fail('现在不能选择卡牌。');
    if (!s.cardChoices.some((card) => card.id === cardId)) return this._fail('这张牌不在奖励中。');
    s.deck.push(this._instance(cardId));
    s.chosenCard = cardId;
    s.rewardStage = 'relic';
    this._log(`将「${CARD_BY_ID.get(cardId).name}」加入牌组。`, 'reward');
    return { ok: true };
  }

  chooseRelic(relicId) {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'relic') return this._fail('先选择一张卡牌。');
    if (!s.relicChoices.some((relic) => relic.id === relicId) || this._hasRelic(relicId)) return this._fail('这件遗物不在奖励中。');
    const relic = { ...RELIC_BY_ID.get(relicId) };
    s.relics.push(relic);
    s.chosenRelic = relicId;
    s.rewardStage = 'ready';
    this._log(`获得遗物「${relic.name}」。`, 'reward');
    return { ok: true };
  }

  continueRun() {
    const s = this.state;
    if (s.phase !== 'reward' || s.rewardStage !== 'ready') return this._fail('先选择卡牌与遗物。');
    const healed = this._heal(s.recoveryAmount);
    if (healed) this._log(`门后的短暂休息，恢复 ${healed} 点生命。`, 'recovery');
    s.room += 1;
    this._beginBattle();
    return { ok: true };
  }

  getState() {
    const snapshot = clone(this.state);
    const enrich = (cards) => cards.map((card) => ({ ...CARD_BY_ID.get(card.cardId), ...card }));
    for (const pile of ['hand', 'drawPile', 'discardPile', 'exhaustPile', 'deck']) snapshot[pile] = enrich(snapshot[pile]);
    snapshot.drawCount = snapshot.drawPile.length;
    snapshot.discardCount = snapshot.discardPile.length;
    snapshot.exhaustCount = snapshot.exhaustPile.length;
    snapshot.shadowWillIntervene = snapshot.phase === 'combat' && snapshot.dependence >= 3 && this._eligibleCards().length > 0;
    snapshot.shadowRecoveryIn = snapshot.dependence > 0 ? 2 - snapshot.unassistedTurns % 2 : 0;
    return snapshot;
  }
}

 if(chosen){detail(chosen);tone('card');notice(chosen.name+' played.');}
 if(method==='useShadow'){clearTimeout(lightTimer);document.body.classList.add('assisted');tone('borrow');notice('+2 energy · +1 card · tether +1');lightTimer=setTimeout(()=>document.body.classList.remove('assisted'),8000);}
 if(method==='endTurn'){const took=state.log.find(l=>l.id>(before.log.at(-1)?.id||0)&&l.tone==='shadow'&&l.text.includes('抢先'));if(took){clearTimeout(claimTimer);document.body.classList.add('claimed');notice('MY TURN — the shadow played a remaining card and spent its energy.');claimTimer=setTimeout(()=>document.body.classList.remove('claimed'),1600);}else notice(state.dependence<before.dependence?'Your move. The tether loosens.':'A fresh hand. Read the next move.');}
 if(state.dependence===0)document.body.classList.remove('assisted','claimed');
 if(state.player.hp<before.player.hp){tone('hurt');if(!document.body.classList.contains('reduced')&&typeof $('hp').animate==='function')$('hp').animate([{opacity:.4},{opacity:1}],{duration:250});}
 if(state.phase!==before.phase||state.rewardStage!==before.rewardStage){notice(state.phase==='reward'?'A new possibility.':state.phase==='victory'?'The door opens.':state.phase==='defeat'?'Keep the discovery. Try another deal.':'Your move.');$('stage').querySelector('button:not(:disabled)')?.focus({preventScroll:true});}
 else if(method==='playCard'){const available=$('hand').querySelector('button:not(:disabled)');(available||$('end')).focus({preventScroll:true});}
}
function restart(same=false){const next=same?state.seed:seed();clearTimeout(lightTimer);clearTimeout(claimTimer);game=new Game({seed:next});document.body.classList.remove('assisted','claimed');$('detail').textContent='Hover or focus a card for its effect. Tap to play.';act('start');notice('A new hand. Your move.');}
function sheet(title,content){lastFocus=document.activeElement;$('sheet-title').textContent=title;$('sheet-body').innerHTML=content;$('overlay').hidden=false;$('close').focus();$('help').setAttribute('aria-expanded','true');}
function closeSheet(){$('overlay').hidden=true;$('help').setAttribute('aria-expanded','false');if(lastFocus?.isConnected)lastFocus.focus();}
function rules(){sheet('Read. Play. Discover.',`<ul><li>Start each turn with <strong>3 energy</strong> and <strong>5 cards</strong>. The circle is the energy cost.</li><li><strong>Next</strong> shows the opponent’s move. Strike deals damage; guard protects you until your next turn.</li><li>Poison bypasses guard at turn end, then loses one stack. Relics can strengthen combinations.</li><li><strong>Borrow</strong> gives 2 energy and 1 card, once per turn. It also adds 1 tether.</li><li>At <strong>3 tether</strong>, the shadow may play a remaining affordable card when you end your turn. It spends your energy.</li><li>Complete <strong>two turns without borrowing</strong> to lose 1 tether. An independent route is possible.</li></ul><p>Five encounters. Choose cards and relics between fights. Your next deal will be different.</p><p>Keys: 1–9 play · E end turn · S borrow · Escape close</p>`);}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='start')act('start');else if(a==='card')act('playCard',b.dataset.card);else if(a==='borrow')act('useShadow');else if(a==='end')act('endTurn');
 else if(a==='reward-card')act('chooseCard',b.dataset.card);else if(a==='reward-relic')act('chooseRelic',b.dataset.relic);else if(a==='continue')act('continueRun');
 else if(a==='new'){if(['combat','reward'].includes(state.phase))sheet('Start another deal?','<p>Your current run will end.</p><button class="primary" data-action="confirm-new">NEW DEAL</button>');else restart();}
 else if(a==='confirm-new'){closeSheet();restart();}else if(a==='retry')restart(true);else if(a==='help')rules();else if(a==='close')closeSheet();
 else if(a==='relic'){const r=state.relics.find(r=>r.id===b.dataset.relic);if(r)sheet(r.name,`<p>${safe(r.description)}</p>`);}
 else if(a==='sound'){soundOn=!soundOn;b.textContent=soundOn?'Sound on':'Sound off';b.setAttribute('aria-pressed',String(soundOn));tone('card');}
 else if(a==='motion'){const off=document.body.classList.toggle('reduced');b.textContent=off?'Motion off':'Motion on';b.setAttribute('aria-pressed',String(off));}
});
for(const type of ['mouseover','focusin'])document.addEventListener(type,event=>{const b=event.target.closest('[data-card]');if(!b)return;const c=(state.phase==='reward'?state.cardChoices:state.hand).find(c=>(c.instanceId||c.id)===b.dataset.card);if(c)detail(c);});
document.addEventListener('keydown',event=>{if(!$('overlay').hidden){if(event.key==='Escape'){event.preventDefault();closeSheet();}if(event.key==='Tab'){const focus=[...$('overlay').querySelectorAll('button,a[href]')];if(event.shiftKey&&document.activeElement===focus[0]){event.preventDefault();focus.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===focus.at(-1)){event.preventDefault();focus[0].focus();}}return;}
 if(event.ctrlKey||event.metaKey||event.altKey||event.repeat||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||state.phase!=='combat')return;
 const k=event.key.toLowerCase();if(k==='e'){event.preventDefault();act('endTurn');}else if(k==='s'){event.preventDefault();act('useShadow');}else if(/^[1-9]$/.test(k)){event.preventDefault();const c=state.hand[+k-1];if(c)act('playCard',c.instanceId);}
});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('reduced');$('motion').textContent='Motion off';$('motion').setAttribute('aria-pressed','true');}
render();
</script></body></html>
