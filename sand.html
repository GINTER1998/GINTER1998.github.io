<style>

<body data-state="loading">
<canvas id="sand-canvas" aria-label="Interactive grey blue dunes. Move your mouse over the sand to draw persistent rake marks, or focus this canvas and use the arrow keys to rake." tabindex="0" data-scene="sand" data-renderer="starting" data-frame="0" data-strokes="0" data-marks="0" data-view="dunes"></canvas>
<canvas id="sand-fallback" aria-hidden="true"></canvas>
<div id="sand-hud">DUNE GARDEN<span id="sand-instruction">MOVE TO RAKE THE SAND</span></div>
<label id="film-control" for="film-grain">GRAIN <select id="film-grain" aria-label="Film grain"><option value="0.010">LOW</option><option value="0.022">FILM</option><option value="0.034" selected>HIGH</option></select></label>
<p id="sand-notice" role="status" aria-live="polite"></p>

</div>

<script>
(()=>{'use strict';
// Every stroke changes a world-space sand height field. The same field is used
// for ray intersection, surface displacement, shadows and lighting.
const canvas=document.getElementById('sand-canvas'),fallbackCanvas=document.getElementById('sand-fallback');
const viewButton=document.getElementById('sand-view'),windButton=document.getElementById('sand-wind'),touchButton=document.getElementById('sand-touch'),widthControl=document.getElementById('rake-width'),notice=document.getElementById('sand-notice'),instruction=document.getElementById('sand-instruction'),cursor=document.getElementById('rake-cursor');
// Floating-point relief avoids the 8-bit stair steps of the first study.
const SIZE=matchMedia('(pointer:coarse)').matches?2048:3072,MIN_X=-36,MIN_Z=-48,SPAN=72,NEUTRAL=0;
const heights=new Float32Array(SIZE*SIZE);
let gl=null,program=null,texture=null,uniforms={},postProgram=null,postUniforms={},sceneTexture=null,sceneFBO=null,isFallback=false,textureDirty=true,frame=0,strokes=0,marks=0,rakeWidth=2.4,wind=false,touchRaking=false,overhead=false,viewMix=0,parentVisible=true,visible=true,lastTime=0,lastWind=0,lastDraw=0,raf=0,previousHit=null,latestPointer=null,mouseInside=false,strokeActive=false,noticeTimer=0,needsFallbackDraw=true,contextLost=false,windTimer=0;
const pointerQueue=[];let rakeAngle=null,previousTines=null,dirtyRect=null,grainAmount=.034;
const grainControl=document.getElementById('film-grain');
const coarse=matchMedia('(pointer:coarse)').matches,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const camera={position:[0,6.8,26],target:[0,.2,-30],right:[1,0,0],up:[0,1,0],forward:[0,0,-1],aspect:1,tan:.445};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function mix(a,b,t){return a+(b-a)*t}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function normalized(a){let d=Math.hypot(...a)||1;return a.map(v=>v/d)}
function dune(d,near,far,height){const s=d>0?near:far;return height*Math.exp(-d*d/(s*s))}
function baseHeight(x,z){
 const c0=z+3.0+10.0*Math.sin(x*.075+.4)+x*.22+x*x*.003;
 const c1=z+35.0+8.0*Math.sin(x*.070+.95)+x*.10;

 return -.7+.17*Math.sin(x*.077+z*.063)+dune(c0,14,3.4,4.8)+dune(c1,16,4.2,5.7)+dune(c2,20,5.8,6.8);
}
function markHeight(x,z){const u=(x-MIN_X)/SPAN*(SIZE-1),v=(z-MIN_Z)/SPAN*(SIZE-1);if(u<0||u>=SIZE-1||v<0||v>=SIZE-1)return 0;const i=Math.floor(u),j=Math.floor(v),fx=u-i,fy=v-j,a=j*SIZE+i;return mix(mix(heights[a],heights[a+1],fx),mix(heights[a+SIZE],heights[a+SIZE+1],fx),fy)}
function heightAt(x,z){return baseHeight(x,z)+markHeight(x,z)}
function updateCamera(){const t=viewMix*viewMix*(3-2*viewMix);camera.position=[mix(0,0,t),mix(6.8,36,t),mix(26,-3,t)];camera.target=[0,mix(.2,0,t),mix(-30,-10,t)];camera.forward=normalized(sub(camera.target,camera.position));camera.right=normalized(cross(camera.forward,[0,1,0]));camera.up=cross(camera.right,camera.forward);camera.aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight);camera.tan=mix(.445,.55,t)}
function castRay(px,py){
 if(isFallback){return{x:MIN_X+px/innerWidth*SPAN,z:MIN_Z+py/innerHeight*SPAN}}
 const nx=(px/innerWidth*2-1)*camera.aspect*camera.tan,ny=(1-py/innerHeight*2)*camera.tan;
 const rd=normalized(camera.forward.map((v,i)=>v+camera.right[i]*nx+camera.up[i]*ny)),ro=camera.position;
 let t=.2,previous=.2;for(let n=0;n<190&&t<240;n++){let x=ro[0]+rd[0]*t,y=ro[1]+rd[1]*t,z=ro[2]+rd[2]*t,d=y-heightAt(x,z);if(d<0){let lo=previous,hi=t;for(let k=0;k<9;k++){let m=(lo+hi)*.5;if(ro[1]+rd[1]*m>heightAt(ro[0]+rd[0]*m,ro[2]+rd[2]*m))lo=m;else hi=m}t=(lo+hi)*.5;x=ro[0]+rd[0]*t;z=ro[2]+rd[2]*t;return x>MIN_X+1&&x<MIN_X+SPAN-1&&z>MIN_Z+1&&z<MIN_Z+SPAN-1?{x,z}:null}previous=t;t+=clamp(d*.50,.23,2.8)}return null;
}
function updateStats(){canvas.dataset.strokes=String(strokes);canvas.dataset.marks=String(marks);canvas.dataset.view=overhead?'overhead':'dunes';canvas.dataset.wind=wind?'on':'off';canvas.dataset.rakeWidth=String(rakeWidth);canvas.dataset.heightResolution=String(SIZE);canvas.dataset.heightPrecision='float32';canvas.dataset.grain=String(grainAmount)}
function say(message){notice.textContent=message;notice.classList.add('visible');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('visible'),2600)}
// Sweep seven continuous capsules. The rake has an unoriented axis: reversing
// direction does not flip tine identities or tear the inside of a turn.
function dirty(x0,y0,x1,y1){
 if(!dirtyRect)dirtyRect=[x0,y0,x1,y1];
 else{dirtyRect[0]=Math.min(dirtyRect[0],x0);dirtyRect[1]=Math.min(dirtyRect[1],y0);dirtyRect[2]=Math.max(dirtyRect[2],x1);dirtyRect[3]=Math.max(dirtyRect[3],y1)}
 textureDirty=true;needsFallbackDraw=true;
}
function carveTine(a,b,spacing){
 const ppm=(SIZE-1)/SPAN,radius=spacing*.62;
 const x0=Math.max(1,Math.floor((Math.min(a.x,b.x)-radius-MIN_X)*ppm)),x1=Math.min(SIZE-2,Math.ceil((Math.max(a.x,b.x)+radius-MIN_X)*ppm));
 const y0=Math.max(1,Math.floor((Math.min(a.z,b.z)-radius-MIN_Z)*ppm)),y1=Math.min(SIZE-2,Math.ceil((Math.max(a.z,b.z)+radius-MIN_Z)*ppm));
 const vx=b.x-a.x,vz=b.z-a.z,len2=vx*vx+vz*vz,footprint=spacing*.235;
 for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){
  const x=MIN_X+i/ppm,z=MIN_Z+j/ppm,t=len2>1e-12?clamp(((x-a.x)*vx+(z-a.z)*vz)/len2,0,1):0;
  const d=Math.hypot(x-a.x-vx*t,z-a.z-vz*t);if(d>radius)continue;

  const shoulder=.010*Math.exp(-Math.pow((d-spacing*.39)/(spacing*.16),2));

  // stamp beads into it. Raised shoulders never fill an existing furrow.

 dirty(x0,y0,x1,y1);
}
function rakeStamp(x,z,angle){
 const nx=-Math.sin(angle),nz=Math.cos(angle),spacing=rakeWidth/7;

 if(previousTines)for(let i=0;i<7;i++)carveTine(previousTines[i],tines[i],spacing);

}
function processPointer(){
 if(!pointerQueue.length)return;
 const points=pointerQueue.splice(0);latestPointer=null;
 for(const p of points){
  const hit=castRay(p.x,p.y);document.body.classList.toggle('rake-over',!!hit);
  if(!hit){previousHit=null;previousTines=null;rakeAngle=null;strokeActive=false;continue}
  if(!previousHit){previousHit=hit;continue}
  const dx=hit.x-previousHit.x,dz=hit.z-previousHit.z,distance=Math.hypot(dx,dz);
  if(distance<.002)continue;
  if(distance>18){previousHit=hit;previousTines=null;rakeAngle=null;strokeActive=false;continue}
  if(!strokeActive){strokes++;strokeActive=true}
  const direction=Math.atan2(dz,dx);if(rakeAngle===null)rakeAngle=direction;
  if(!previousTines)rakeStamp(previousHit.x,previousHit.z,rakeAngle);

  for(let i=1;i<=steps;i++){
   const delta=((direction-rakeAngle+Math.PI*1.5)%Math.PI+Math.PI)%Math.PI-Math.PI*.5;
   rakeAngle+=clamp(delta,-step*2.4/rakeWidth,step*2.4/rakeWidth);
   const t=i/steps;rakeStamp(mix(previousHit.x,hit.x,t),mix(previousHit.z,hit.z,t),rakeAngle);
  }
  previousHit=hit;
 }
 updateStats();
}
function releasePointer(){previousHit=null;previousTines=null;rakeAngle=null;pointerQueue.length=0;latestPointer=null;strokeActive=false;mouseInside=false;document.body.classList.remove('rake-over')}

function pointerMove(event){
 if(!visible||contextLost)return;if(event.pointerType==='touch'&&!touchRaking)return;
 if(event.pointerType==='touch'&&event.buttons===0)return;

 const samples=typeof event.getCoalescedEvents==='function'?event.getCoalescedEvents():[];
 for(const p of samples.length?samples:[event])pointerQueue.push({x:p.clientX,y:p.clientY});
 // Keep the complete recent curve when the browser groups rapid input.
 if(pointerQueue.length>256)pointerQueue.splice(0,pointerQueue.length-256);
 latestPointer=pointerQueue[pointerQueue.length-1];if(!raf)start();
}

function bindPointer(surface){surface.addEventListener('pointermove',pointerMove);surface.addEventListener('pointerdown',event=>{if(event.pointerType==='touch'&&!touchRaking)return;if(event.pointerType==='touch'){event.preventDefault();surface.setPointerCapture(event.pointerId)}releasePointer();pointerMove(event)});surface.addEventListener('pointerup',event=>{if(event.pointerType==='touch'){processPointer();releasePointer();start()}});surface.addEventListener('pointercancel',releasePointer);surface.addEventListener('pointerleave',releasePointer)}
bindPointer(canvas);bindPointer(fallbackCanvas);document.querySelector('.sand-tools').addEventListener('pointerenter',releasePointer);window.addEventListener('blur',releasePointer);
let keyboardPointer=null;function keyboardRake(event){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape'].includes(event.key))return;event.preventDefault();if(event.key==='Escape'){keyboardPointer=null;releasePointer();return}if(!keyboardPointer)keyboardPointer={x:innerWidth*.5,y:innerHeight*.73};const step=event.shiftKey?34:16;if(event.key==='ArrowLeft')keyboardPointer.x-=step;if(event.key==='ArrowRight')keyboardPointer.x+=step;if(event.key==='ArrowUp')keyboardPointer.y-=step;if(event.key==='ArrowDown')keyboardPointer.y+=step;keyboardPointer.x=clamp(keyboardPointer.x,24,innerWidth-24);keyboardPointer.y=clamp(keyboardPointer.y,innerHeight*.47,innerHeight-24);pointerMove({pointerType:'mouse',clientX:keyboardPointer.x,clientY:keyboardPointer.y})}for(const surface of [canvas,fallbackCanvas]){surface.addEventListener('keydown',keyboardRake);surface.addEventListener('blur',()=>{keyboardPointer=null;releasePointer()})}
viewButton.addEventListener('click',()=>{overhead=!overhead;viewButton.textContent=overhead?'DUNES ↙':'OVERHEAD ↗';viewButton.setAttribute('aria-label',overhead?'Switch to dunes view':'Switch to overhead view');viewButton.setAttribute('aria-pressed',String(overhead));releasePointer();updateStats();start()});
document.getElementById('sand-clear').addEventListener('click',()=>{heights.fill(NEUTRAL);strokes=0;marks=0;dirtyRect=null;textureDirty=true;needsFallbackDraw=true;releasePointer();updateStats();say('A clean beginning.');start()});
widthControl.addEventListener('change',()=>{rakeWidth=Number(widthControl.value);releasePointer();updateStats()});
windButton.addEventListener('click',()=>{wind=!wind;windButton.textContent=wind?'WIND ON':'WIND OFF';windButton.setAttribute('aria-pressed',String(wind));updateStats();say(wind?'The wind will slowly soften your marks.':'Your marks will stay in the sand.');start()});
touchButton.addEventListener('click',()=>{touchRaking=!touchRaking;touchButton.textContent=touchRaking?'RAKE ON':'RAKE OFF';touchButton.setAttribute('aria-pressed',String(touchRaking));document.body.classList.toggle('touch-raking',touchRaking);instruction.textContent=touchRaking?'DRAG TO RAKE · TAP RAKE TO SCROLL':(coarse?'TAP RAKE ON TO DRAW IN THE SAND':'MOVE TO RAKE THE SAND');releasePointer()});
if(coarse)instruction.textContent='TAP RAKE ON TO DRAW IN THE SAND';
grainControl.addEventListener('change',()=>{grainAmount=Number(grainControl.value);updateStats();needsFallbackDraw=true;start()});
grainControl.addEventListener('pointerenter',releasePointer);
const vertexSource=`#version 300 es
precision highp float;
out vec2 vUV;
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUV=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const fragmentSource=`#version 300 es
precision highp float;
in vec2 vUV;
out vec4 fragColor;
uniform sampler2D uMarks;
uniform vec2 uResolution;
uniform vec3 uCamera,uForward,uRight,uUp;
uniform float uAspect,uTan,uTime;
uniform int uQuality;
const vec3 LIGHT=vec3(-.730,.380,-.568);
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float dune(float d,float a,float b,float h){float s=d>0.?a:b;return h*exp(-d*d/(s*s));}
float base(vec2 p){float x=p.x,z=p.y;float c0=z+3.+10.*sin(x*.075+.4)+x*.22+x*x*.003;float c1=z+35.+8.*sin(x*.070+.95)+x*.10;float c2=z+72.+8.*sin(x*.047+1.7)-x*.07;return -.7+.17*sin(x*.077+z*.063)+dune(c0,14.,3.4,4.8)+dune(c1,16.,4.2,5.7)+dune(c2,20.,5.8,6.8);}

float terrain(vec2 p){return base(p)+mark(p);}
float ripples(vec2 p){float windWarp=p.x*55.+p.y*11.3+.8*sin(p.y*.44)+1.2*sin(p.x*.11+p.y*.15);return sin(windWarp)*.00009+sin(windWarp*1.96+.9)*.00002;}

vec3 sky(vec3 ray){float horizon=exp(-max(ray.y,0.)*3.8);vec3 col=mix(vec3(.009,.019,.029),vec3(.040,.068,.084),horizon);float haze=exp(-abs(ray.x+.28)*1.6)*horizon;return col+vec3(.006,.010,.011)*haze;}
float shadow(vec3 p){float result=1.,t=.16;for(int i=0;i<20;i++){vec3 q=p+LIGHT*t;float delta=q.y-base(q.xz);result=min(result,10.*delta/t);t+=.20+t*.18;}return clamp(result,.0,1.);}

 if(hit){float lo=last,hi=t;for(int i=0;i<14;i++){float m=(lo+hi)*.5;vec3 q=ro+rd*m;if(q.y>terrain(q.xz))lo=m;else hi=m;}t=(lo+hi)*.5;vec3 p=ro+rd*t;float ep=.030;
  vec3 n=normalize(vec3(surface(p.xz-vec2(ep,0.))-surface(p.xz+vec2(ep,0.)),2.*ep,surface(p.xz-vec2(0.,ep))-surface(p.xz+vec2(0.,ep))));

  float glint=pow(max(dot(n,normalize(LIGHT-rd)),0.),24.)*.016*sh;color+=vec3(.6,.70,.76)*glint;
  float fog=1.-exp(-max(t-25.,0.)*.006);color=mix(color,vec3(.045,.077,.093),fog*.7);
  // Fine wind ripples fade naturally into the distance, not a screen texture.
  float rippleMask=clamp(1.-t/90.,0.,1.);color*=1.+sin(p.x*55.+p.z*11.3+.8*sin(p.z*.44))*rippleMask*.0025;
 }
 color=pow(max(color,vec3(0.)),vec3(.93));
 // Grain is added at final display resolution, after edge antialiasing.
 float vig=1.-.12*pow(length(uv*vec2(.64,.48)),1.7);color*=vig;
 fragColor=vec4(clamp(color,0.,1.),1.);
}`;
const postSource=`#version 300 es
precision highp float;
in vec2 vUV;out vec4 fragColor;
uniform sampler2D uScene;uniform vec2 uResolution;uniform float uGrain;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
uint hashGrain(uint n){n^=n>>16;n*=0x7feb352du;n^=n>>15;n*=0x846ca68bu;return n^(n>>16);}
float randomGrain(uvec2 p,uint seed){return float(hashGrain(p.x*1973u+p.y*9277u+seed))/4294967295.;}
void main(){
 vec2 uv=gl_FragCoord.xy/uResolution,px=1./uResolution;
 vec3 c=texture(uScene,uv).rgb;
 float nw=luma(texture(uScene,uv+px*vec2(-1,1)).rgb),ne=luma(texture(uScene,uv+px*vec2(1,1)).rgb);
 float sw=luma(texture(uScene,uv+px*vec2(-1,-1)).rgb),se=luma(texture(uScene,uv+px*vec2(1,-1)).rgb),m=luma(c);
 float low=min(m,min(min(nw,ne),min(sw,se))),high=max(m,max(max(nw,ne),max(sw,se)));
 if(high-low>max(.006,high*.075)){
  vec2 dir=vec2(-((nw+ne)-(sw+se)),((nw+sw)-(ne+se)));
  float reduce=max((nw+ne+sw+se)*.03125,.001);float inv=1./(min(abs(dir.x),abs(dir.y))+reduce);
  dir=clamp(dir*inv,vec2(-6),vec2(6))*px;
  vec3 a=.5*(texture(uScene,uv+dir*(-1./6.)).rgb+texture(uScene,uv+dir*(1./6.)).rgb);
  vec3 b=a*.5+.25*(texture(uScene,uv+dir*(-.5)).rgb+texture(uScene,uv+dir*.5).rgb);
  c=luma(b)<low||luma(b)>high?a:b;
 }
 // Fine, monochrome silver grain. It remains stable on a still frame and
 // is applied after FXAA, so the texture never turns into enlarged blocks.
 uvec2 p=uvec2(gl_FragCoord.xy);float g=(randomGrain(p,17u)+randomGrain(p,19711u)+randomGrain(p,397163u)+randomGrain(p,941071u)-2.)*1.73205;
 float density=mix(.65,1.,sqrt(clamp(luma(c),0.,1.)));
 c+=vec3(g*uGrain*density);
 fragColor=vec4(clamp(c,0.,1.),1.);
}`;

function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const message=gl.getShaderInfoLog(s);gl.deleteShader(s);throw Error(message)}return s}
function makeProgram(fragment){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vertexSource));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
function initGL(){
 gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance',preserveDrawingBuffer:false});if(!gl)throw Error('WebGL 2 unavailable');
 program=makeProgram(fragmentSource);postProgram=makeProgram(postSource);gl.bindVertexArray(gl.createVertexArray());
 for(const key of ['uMarks','uResolution','uCamera','uForward','uRight','uUp','uAspect','uTan','uTime'])uniforms[key]=gl.getUniformLocation(program,key);
 for(const key of ['uScene','uResolution','uGrain'])postUniforms[key]=gl.getUniformLocation(postProgram,key);
 texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.R32F,SIZE,SIZE,0,gl.RED,gl.FLOAT,heights);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 sceneTexture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,sceneTexture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 sceneFBO=gl.createFramebuffer();
 gl.useProgram(program);gl.uniform1i(uniforms.uMarks,0);gl.useProgram(postProgram);gl.uniform1i(postUniforms.uScene,0);
 canvas.dataset.renderer='webgl2';canvas.dataset.antialias='FXAA';document.body.dataset.state='ready';
}

function initFallback(message){isFallback=true;canvas.style.display='none';fallbackCanvas.style.display='block';canvas.setAttribute('aria-hidden','true');canvas.tabIndex=-1;fallbackCanvas.removeAttribute('aria-hidden');fallbackCanvas.tabIndex=0;fallbackCanvas.setAttribute('aria-label',canvas.getAttribute('aria-label'));canvas.dataset.renderer='canvas2d';canvas.dataset.fallbackReason=message;document.body.dataset.state='fallback';overhead=true;viewMix=1;viewButton.disabled=true;viewButton.textContent='OVERHEAD';instruction.textContent=coarse?'TAP RAKE ON TO DRAW':'MOVE TO RAKE · OVERHEAD VIEW';updateStats()}
function drawFallback(){const w=Math.min(1280,Math.round(innerWidth*Math.min(devicePixelRatio||1,1.5))),h=Math.max(180,Math.round(w*innerHeight/innerWidth));fallbackCanvas.width=w;fallbackCanvas.height=h;const context=fallbackCanvas.getContext('2d'),data=context.createImageData(w,h);for(let j=0;j<h;j++){for(let i=0;i<w;i++){const x=MIN_X+i/w*SPAN,z=MIN_Z+j/h*SPAN,e=.075,n=normalized([heightAt(x-e,z)-heightAt(x+e,z),2*e,heightAt(x,z-e)-heightAt(x,z+e)]),sun=Math.max(dot(n,[-.730,.380,-.568]),0),v=.16+sun*.86,k=(j*w+i)*4;data.data[k]=Math.round((.475*v+.019)*255);data.data[k+1]=Math.round((.5*v+.031)*255);data.data[k+2]=Math.round((.494*v+.043)*255);const grain=((Math.random()+Math.random()+Math.random()+Math.random())-2)*1.732*grainAmount*255*.8;data.data[k]+=grain;data.data[k+1]+=grain;data.data[k+2]+=grain;data.data[k+3]=255}}context.putImageData(data,0,0);needsFallbackDraw=false}
function resize(){
 if(isFallback){needsFallbackDraw=true;return}
 const dpr=Math.min(devicePixelRatio||1,2),maxPixels=coarse?1800000:6800000;
 const scale=Math.min(1,Math.sqrt(maxPixels/(innerWidth*innerHeight*dpr*dpr))),w=Math.max(1,Math.round(innerWidth*dpr*scale)),h=Math.max(1,Math.round(innerHeight*dpr*scale));
 if(canvas.width!==w||canvas.height!==h||!canvas.dataset.renderSize){
  canvas.width=w;canvas.height=h;gl.bindTexture(gl.TEXTURE_2D,sceneTexture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneTexture,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Scene target unavailable');gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);
 }
 canvas.dataset.renderSize=w+'x'+h;updateCamera();
}
function uploadRelief(){
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
 if(dirtyRect){
  const [x,y,r,b]=dirtyRect;gl.pixelStorei(gl.UNPACK_ROW_LENGTH,SIZE);gl.pixelStorei(gl.UNPACK_SKIP_PIXELS,x);gl.pixelStorei(gl.UNPACK_SKIP_ROWS,y);
  gl.texSubImage2D(gl.TEXTURE_2D,0,x,y,r-x+1,b-y+1,gl.RED,gl.FLOAT,heights);
  gl.pixelStorei(gl.UNPACK_ROW_LENGTH,0);gl.pixelStorei(gl.UNPACK_SKIP_PIXELS,0);gl.pixelStorei(gl.UNPACK_SKIP_ROWS,0);
 }else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,SIZE,SIZE,gl.RED,gl.FLOAT,heights);
 textureDirty=false;dirtyRect=null;
}

function erode(){for(let n=0;n<heights.length;n++)heights[n]*=.96;dirtyRect=null;textureDirty=true;needsFallbackDraw=true}

function render(now){raf=0;if(!visible||contextLost)return;const dt=Math.min((now-lastTime)/1000,.05)||.016;lastTime=now;const target=overhead?1:0;if(Math.abs(viewMix-target)>.0002){viewMix=reduced?target:mix(viewMix,target,1-Math.exp(-dt*4.6));previousHit=null;previousTines=null;rakeAngle=null;pointerQueue.length=0}else viewMix=target;updateCamera();processPointer();if(wind&&marks&&now-lastWind>550){erode();lastWind=now}if(isFallback){if(needsFallbackDraw&&now-lastDraw>80){drawFallback();lastDraw=now}}else{if(textureDirty)uploadRelief();gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);gl.useProgram(program);gl.uniform2f(uniforms.uResolution,canvas.width,canvas.height);gl.uniform3fv(uniforms.uCamera,camera.position);gl.uniform3fv(uniforms.uForward,camera.forward);gl.uniform3fv(uniforms.uRight,camera.right);gl.uniform3fv(uniforms.uUp,camera.up);gl.uniform1f(uniforms.uAspect,camera.aspect);gl.uniform1f(uniforms.uTan,camera.tan);gl.uniform1f(uniforms.uTime,now/1000);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.bindTexture(gl.TEXTURE_2D,sceneTexture);gl.useProgram(postProgram);gl.uniform2f(postUniforms.uResolution,canvas.width,canvas.height);gl.uniform1f(postUniforms.uGrain,grainAmount);gl.drawArrays(gl.TRIANGLES,0,3)}frame++;canvas.dataset.frame=String(frame);if(latestPointer||viewMix!==target||(isFallback&&needsFallbackDraw)){raf=requestAnimationFrame(render)}else if(wind&&marks){windTimer=setTimeout(()=>{windTimer=0;start()},Math.max(30,560-(now-lastWind)))}}
function start(){if(windTimer){clearTimeout(windTimer);windTimer=0}if(visible&&!raf&&!contextLost){lastTime=performance.now();raf=requestAnimationFrame(render)}}
function syncVisibility(){visible=parentVisible&&!document.hidden;canvas.dataset.active=String(visible);if(!visible){if(raf)cancelAnimationFrame(raf);raf=0;if(windTimer)clearTimeout(windTimer);windTimer=0;releasePointer()}else{resize();start()}parent.postMessage({type:'ginter-sand-state',visible,frame},location.origin)}
window.addEventListener('resize',()=>{resize();releasePointer();start()});document.addEventListener('visibilitychange',syncVisibility);window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin)return;if(event.data?.type==='ginter-sand-visibility'){parentVisible=Boolean(event.data.visible);syncVisibility()}});canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();contextLost=true;canvas.dataset.renderer='context-lost';if(raf)cancelAnimationFrame(raf);raf=0;releasePointer();say('The scene is resting. Reload to restore the view.')});canvas.addEventListener('webglcontextrestored',()=>{contextLost=false;try{initGL();textureDirty=true;dirtyRect=null;canvas.dataset.renderSize='';resize();start()}catch(error){initFallback(error.message);start()}});
try{initGL()}catch(error){initFallback(error.message)}updateStats();resize();syncVisibility();parent.postMessage({type:'ginter-sand-ready',renderer:canvas.dataset.renderer},location.origin);window.addEventListener('pagehide',()=>{if(raf)cancelAnimationFrame(raf);raf=0;if(windTimer)clearTimeout(windTimer);windTimer=0});
})();
</script>
